name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw verify
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @haoblog/api-client check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --dir apps/web typecheck
      - run: corepack pnpm --dir apps/web test
      - run: corepack pnpm --dir apps/web build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: cp infra/compose/.env.ci.example .env.ci
      - run: docker compose --env-file .env.ci -f infra/compose/compose.dev.yml config
      - run: docker compose --env-file .env.ci -f infra/compose/compose.prod.yml config
      - run: docker build -f apps/api/Dockerfile -t haoblog-api:ci .
      - run: docker build -f apps/web/Dockerfile -t haoblog-web:ci .
      - name: Start infrastructure
        run: docker compose --env-file .env.ci -f infra/compose/compose.prod.yml up -d --wait --wait-timeout 180
      - name: Smoke test
        env:
          HAOBLOG_BASE_URL: http://localhost
        run: corepack pnpm smoke
      - name: Dump service logs on failure
        if: failure()
        run: docker compose --env-file .env.ci -f infra/compose/compose.prod.yml ps && docker compose --env-file .env.ci -f infra/compose/compose.prod.yml logs --no-color
      - name: Tear down infrastructure
        if: always()
        run: docker compose --env-file .env.ci -f infra/compose/compose.prod.yml down -v
