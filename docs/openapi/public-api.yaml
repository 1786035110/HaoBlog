openapi: 3.1.0
info:
  title: HaoBlog API
  version: 0.1.0
servers:
  - url: /
paths:
  /rss.xml:
    get:
      operationId: getRssFeed
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: RSS 2.0 feed of the latest public articles
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Short shared-cache policy
              schema: { type: string }
          content:
            application/rss+xml:
              schema: { type: string }
        '304':
          description: RSS feed has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Short shared-cache policy
              schema: { type: string }
  /sitemap.xml:
    get:
      operationId: getSitemap
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Sitemap of public site pages and articles
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Short shared-cache policy
              schema: { type: string }
          content:
            application/xml:
              schema: { type: string }
        '304':
          description: Sitemap has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Short shared-cache policy
              schema: { type: string }
  /api/v1/public/site:
    get:
      operationId: getPublicSite
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Site settings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '304':
          description: Site representation has not changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/garden:
    get:
      operationId: getPublicGarden
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Public knowledge garden graph derived from published article snapshots and active tools
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GardenGraphResponse' }
        '304':
          description: Garden graph has not changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/tools:
    get:
      operationId: listPublicTools
      security: []
      parameters:
        - name: category
          in: query
          description: Category slug or UUID
          schema: { type: string, maxLength: 160 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ToolType' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 240 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active public tools and their valid categories
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicToolListResponse'
        '304':
          description: Public tool representation has not changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/articles:
    get:
      operationId: listPublicArticles
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published articles
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListResponse'
        '304':
          description: Public article list representation has not changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/articles/{slug}:
    get:
      operationId: getPublicArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published article detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '304':
          description: Public article representation has not changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
        '404':
          $ref: '#/components/responses/ArticleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/search/articles:
    get:
      operationId: searchPublicArticles
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: NFKC-normalized search query; 2 to 100 Unicode code points
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Public article summaries matching the query
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleListResponse' }
        '304':
          description: Search representation has not changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/articles/{slug}/comments:
    get:
      operationId: listPublicArticleComments
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Approved top-level comments and first-level replies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createPublicArticleComment
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCreateRequest' }
      responses:
        '201':
          description: Comment created and published when the submission is genuine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentSubmissionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Invalid CSRF token or delete credential
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemResponse' } } }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
        '409': { $ref: '#/components/responses/CommentConflict' }
        '429': { $ref: '#/components/responses/CommentRateLimited' }
  /api/v1/public/articles/{slug}/comments/form-context:
    get:
      operationId: getPublicCommentFormContext
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200':
          description: CSRF token and one-time comment form challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentFormContext' }
        '404':
          $ref: '#/components/responses/ArticleNotFound'
  /api/v1/public/comments/{id}:
    delete:
      operationId: deletePublicComment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/CommentDeleteToken'
      responses:
        '204': { description: Comment content deleted }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/CommentConflict' }
  /api/v1/public/article-previews/{token}:
    get:
      operationId: getPublicArticlePreview
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }
      responses:
        '200':
          description: Uncached article working-copy preview
          headers:
            Cache-Control: { schema: { type: string } }
            Referrer-Policy: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticlePreviewResponse' } } }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '410': { $ref: '#/components/responses/ArticlePreviewGone' }
  /api/v1/admin/articles:
    get:
      operationId: listAdminArticles
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ArticleStatus' } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 240 } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Administrator article list
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdminArticleListResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminArticle
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/AdminArticleCreateRequest' } }
      responses:
        '201':
          description: Draft created
          headers: { Location: { schema: { type: string, format: uri } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/media/uploads:
    post:
      operationId: createAdminMediaUpload
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MediaUploadRequest' } } }
      responses:
        '201':
          description: Short-lived OSS POST policy
          content: { application/json: { schema: { $ref: '#/components/schemas/MediaUploadResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '503': { $ref: '#/components/responses/MediaStorageUnavailable' }
  /api/v1/admin/comments:
    get:
      operationId: listAdminComments
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CommentStatus' } }
        - { name: articleId, in: query, schema: { type: string, format: uuid } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 240 } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Administrator comment management log; email is masked and security material is omitted
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminCommentListResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/comments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminComment
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Comment detail with decrypted optional email, content, and moderation audit
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminCommentDetail' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
  /api/v1/admin/comments/{id}/moderation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: moderateAdminComment
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommentModerationRequest' } } } }
      responses:
        '200': { description: Moderated comment, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCommentDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/site:
    get:
      operationId: getAdminSite
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Administrator site settings, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSiteResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateAdminSite
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSiteUpdateRequest' } } } }
      responses:
        '200': { description: Site settings updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSiteResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/media/uploads/{uploadId}/complete:
    post:
      operationId: completeAdminMediaUpload
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Confirmed media asset
          content: { application/json: { schema: { $ref: '#/components/schemas/MediaAssetResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '410': { $ref: '#/components/responses/MediaUploadExpired' }
        '503': { $ref: '#/components/responses/MediaStorageUnavailable' }
  /api/v1/admin/media/{mediaId}:
    delete:
      operationId: recycleAdminMedia
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Media asset marked as deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAdminArticle
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Administrator article, content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    put:
      operationId: updateAdminArticle
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleUpdateRequest' } } }
      responses:
        '200': { description: Article updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ArticleVersionConflict' }
    delete:
      operationId: deleteAdminArticle
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Draft physically deleted }
        '200': { description: Article archived, content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
  /api/v1/admin/articles/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAdminArticleVersions
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Administrator article version summaries without Markdown
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleVersionListResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
  /api/v1/admin/articles/{id}/versions/{revisionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAdminArticleVersion
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Administrator article version detail
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleVersionResponse' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
  /api/v1/admin/articles/{id}/versions/{revisionId}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreAdminArticleVersion
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleVersionRequest' } } } }
      responses:
        '200':
          description: Restored editable working copy; public revision is unchanged
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminArticleResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/articles/{id}/publish:
    post:
      operationId: publishAdminArticle
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleVersionRequest' } } } }
      responses:
        '200': { description: Published article, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleActionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/articles/{id}/schedule:
    post:
      operationId: scheduleAdminArticle
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleArticleRequest' } } } }
      responses:
        '200': { description: Scheduled article, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleActionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/articles/{id}/archive:
    post:
      operationId: archiveAdminArticle
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleVersionRequest' } } } }
      responses:
        '200': { description: Archived article, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleActionResponse' } } } }
