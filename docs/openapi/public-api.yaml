components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: HAOBLOG_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    CommentDeleteToken:
      name: X-Comment-Delete-Token
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 43 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    InternalError:
      description: Internal error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    ArticleNotFound:
      description: Public article not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    ResourceNotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    ArticlePreviewGone:
      description: Preview token no longer matches the article version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    CommentConflict:
      description: Comment submission conflicts with current state or duplicate content
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    CommentRateLimited:
      description: Comment rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until another comment may be submitted
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    ArticleVersionConflict:
      description: Article working copy version is stale
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ArticleVersionConflictProblem' }
    Unauthenticated:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    Forbidden:
      description: Access denied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    CsrfInvalid:
      description: Invalid CSRF token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    AuthenticationFailed:
      description: Invalid administrator credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    LoginRateLimited:
      description: Login attempts from this source are temporarily rate limited
      headers:
        Retry-After:
          description: Seconds until another login attempt may be tried
          schema: { type: integer, minimum: 1, maximum: 900 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    MediaUploadExpired:
      description: Upload intent expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    MediaStorageUnavailable:
      description: Object storage metadata service unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
  schemas:
    SiteResponse:
      type: object
      required: [title, description, siteUrl, authorName, commentsEnabled, musicEnabled, musicManifestUrl, threeDEnabled]
      properties:
        title: { type: string }
        description: { type: string }
        siteUrl: { type: string, format: uri }
        authorName: { type: string }
        commentsEnabled: { type: boolean }
        musicEnabled: { type: boolean }
        musicManifestUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
        threeDEnabled: { type: boolean }
    ArticleSummary:
      type: object
      required: [id, slug, title, excerpt, publishedAt, coverImageUrl, commentsEnabled]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        coverImageUrl: { type: [string, 'null'], format: uri }
        commentsEnabled: { type: boolean }
    ArticleListResponse:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    ArticleResponse:
      type: object
      required: [id, slug, title, excerpt, publishedAt, modifiedAt, markdown, seoTitle, seoDescription, coverImageUrl, commentsEnabled]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        markdown: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        coverImageUrl: { type: [string, 'null'], format: uri }
        commentsEnabled: { type: boolean }
    CommentFormContext:
      type: object
      required: [csrfToken, challenge, expiresAt, commentsEnabled]
      properties:
        csrfToken: { type: string, minLength: 1 }
        challenge: { type: string, minLength: 43, maxLength: 43 }
        expiresAt: { type: string, format: date-time }
        commentsEnabled: { type: boolean }
    CommentCreateRequest:
      type: object
      required: [nickname, content, challenge]
      properties:
        nickname: { type: string, minLength: 2, maxLength: 40 }
        email: { type: [string, 'null'], maxLength: 254, format: email }
        content: { type: string, minLength: 2, maxLength: 2000 }
        parentId: { type: [string, 'null'], format: uuid }
        challenge: { type: string, minLength: 43, maxLength: 43 }
        honeypot: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 200 }
    CommentView:
      type: object
      required: [id, nickname, content, createdAt, replies]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        replies: { type: array, items: { $ref: '#/components/schemas/CommentView' } }
    CommentPageResponse:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CommentView' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    CommentSubmissionResponse:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [APPROVED] }
        createdAt: { type: string, format: date-time }
        deleteToken: { type: [string, 'null'], minLength: 43, maxLength: 43 }
    CommentStatus:
      type: string
      enum: [PENDING, APPROVED, SPAM, REJECTED, USER_DELETED]
    CommentModerationRequest:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [APPROVED, SPAM, REJECTED] }
        reason: { type: [string, 'null'], maxLength: 600 }
    AdminCommentSummary:
      type: object
      required: [id, articleId, nickname, content, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        articleId: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        nickname: { type: string }
        content: { type: string }
        emailMasked: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CommentStatus' }
        moderatorId: { type: [string, 'null'], format: uuid }
        moderationReason: { type: [string, 'null'] }
