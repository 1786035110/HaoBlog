openapi: 3.1.0
info:
  title: HaoBlog API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/v1/public/site:
    get:
      operationId: getPublicSite
      responses:
        '200':
          description: Site settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/articles:
    get:
      operationId: listPublicArticles
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Published articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/public/articles/{slug}:
    get:
      operationId: getPublicArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200':
          description: Published article detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '304':
          description: Public article representation has not changed
        '404':
          $ref: '#/components/responses/ArticleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/session:
    post:
      operationId: loginAdmin
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Administrator session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
    get:
      operationId: getAdminSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current administrator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: logoutAdmin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Administrator session deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/admin/csrf:
    get:
      operationId: getAdminCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token for administrator write requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: HAOBLOG_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    InternalError:
      description: Internal error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    ArticleNotFound:
      description: Public article not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    Unauthenticated:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    Forbidden:
      description: Access denied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    CsrfInvalid:
      description: Invalid CSRF token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    AuthenticationFailed:
      description: Invalid administrator credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    LoginRateLimited:
      description: Login attempts from this source are temporarily rate limited
      headers:
        Retry-After:
          description: Seconds until another login attempt may be tried
          schema: { type: integer, minimum: 1, maximum: 900 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
  schemas:
    SiteResponse:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
    ArticleSummary:
      type: object
      required: [id, slug, title, publishedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
    ArticleListResponse:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    ArticleResponse:
      type: object
      required: [id, slug, title, publishedAt, markdown]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        markdown: { type: string }
    ProblemResponse:
      type: object
      required: [code, title, detail, traceId]
      properties:
        code: { type: string }
        title: { type: string }
        detail: { type: string }
        traceId: { type: string }
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 200, format: password }
    AdminSessionResponse:
      type: object
      required: [username, role, authenticated]
      properties:
        username: { type: string }
        role: { type: string, enum: [ADMIN] }
        authenticated: { type: boolean }
    CsrfTokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
  headers:
    ETag:
      description: Entity tag for the public representation
      schema: { type: string }
