spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: haoblog-api
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/haoblog_dev}
    username: ${JDBC_DATABASE_USERNAME:haoblog_dev}
    password: ${JDBC_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:6}
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:1}
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: SET statement_timeout = '3s'; SET lock_timeout = '1s'
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 5
        cancelSignalTimeout: 1
  mail:
    host: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_HOST:}
    port: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_PORT:25}
    username: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_USERNAME:}
    password: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
      mail.smtp.quitwait: false
      mail.smtp.socketFactory.class: io.haoblog.comment.infrastructure.DeadlineSmtpSocketFactory
      mail.smtp.socketFactory.fallback: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      pool:
        size: 1
  flyway:
    enabled: true
    # 使用独立迁移连接，不能继承业务连接的短 SQL 超时。
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    placeholders:
      admin_username: ${HAOBLOG_ADMIN_USERNAME}
      admin_password_hash: ${HAOBLOG_ADMIN_PASSWORD_HASH}
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  config:
    import: optional:classpath:application-local.yml
  mvc:
    throw-exception-if-no-handler-found: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      # SMTP 是可选投递通道，不能决定站点是否可接收请求。
      enabled: false
server:
  shutdown: graceful
  port: ${API_PORT:8080}
  tomcat:
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:64}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:32}
    processor-cache: ${SERVER_TOMCAT_PROCESSOR_CACHE:20}
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-swallow-size: 8MB
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:20}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: HAOBLOG_SESSION
        http-only: true
        same-site: lax
        secure: ${HAOBLOG_SESSION_COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false
haoblog:
  site:
    public-base-url: ${HAOBLOG_PUBLIC_BASE_URL:http://localhost:3000}
    author-name: ${HAOBLOG_AUTHOR_NAME:Hao}
    music-manifest-url: ${HAOBLOG_MUSIC_MANIFEST_URL:}
  security:
    session-cookie-secure: ${HAOBLOG_SESSION_COOKIE_SECURE:false}
  seed:
    enabled: ${HAOBLOG_SEED_ENABLED:false}
  media:
    oss:
      enabled: ${HAOBLOG_OSS_ENABLED:false}
      bucket: ${HAOBLOG_OSS_BUCKET:}
      region: ${HAOBLOG_OSS_REGION:}
      endpoint: ${HAOBLOG_OSS_ENDPOINT:}
      access-key-id: ${HAOBLOG_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${HAOBLOG_OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${HAOBLOG_OSS_PUBLIC_BASE_URL:}
      max-size-bytes: ${HAOBLOG_OSS_MAX_SIZE_BYTES:5242880}
      max-dimension: ${HAOBLOG_OSS_MAX_DIMENSION:2560}
  comment:
    security-key: ${HAOBLOG_COMMENT_SECURITY_KEY:}
    notification:
      enabled: ${HAOBLOG_COMMENT_NOTIFICATION_ENABLED:false}
      recipient: ${HAOBLOG_COMMENT_NOTIFICATION_RECIPIENT:}
      from: ${HAOBLOG_COMMENT_NOTIFICATION_FROM:}
