spring:
  application:
    name: haoblog-api
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/haoblog_dev}
    username: ${JDBC_DATABASE_USERNAME:haoblog_dev}
    password: ${JDBC_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:6}
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:1}
  mail:
    host: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_HOST:}
    port: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_PORT:25}
    username: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_USERNAME:}
    password: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      pool:
        size: 1
  flyway:
    enabled: true
    placeholders:
      admin_username: ${HAOBLOG_ADMIN_USERNAME}
      admin_password_hash: ${HAOBLOG_ADMIN_PASSWORD_HASH}
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  config:
    import: optional:classpath:application-local.yml
  mvc:
    throw-exception-if-no-handler-found: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: ${HAOBLOG_COMMENT_NOTIFICATION_ENABLED:false}
server:
  port: ${API_PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:20}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: HAOBLOG_SESSION
        http-only: true
        same-site: lax
        secure: ${HAOBLOG_SESSION_COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false
haoblog:
  site:
    public-base-url: ${HAOBLOG_PUBLIC_BASE_URL:http://localhost:3000}
    author-name: ${HAOBLOG_AUTHOR_NAME:Hao}
  security:
    session-cookie-secure: ${HAOBLOG_SESSION_COOKIE_SECURE:false}
  seed:
    enabled: ${HAOBLOG_SEED_ENABLED:false}
  media:
    oss:
      enabled: ${HAOBLOG_OSS_ENABLED:false}
      bucket: ${HAOBLOG_OSS_BUCKET:}
      region: ${HAOBLOG_OSS_REGION:}
      endpoint: ${HAOBLOG_OSS_ENDPOINT:}
      access-key-id: ${HAOBLOG_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${HAOBLOG_OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${HAOBLOG_OSS_PUBLIC_BASE_URL:}
      max-size-bytes: ${HAOBLOG_OSS_MAX_SIZE_BYTES:5242880}
      max-dimension: ${HAOBLOG_OSS_MAX_DIMENSION:2560}
  comment:
    security-key: ${HAOBLOG_COMMENT_SECURITY_KEY:}
    notification:
      enabled: ${HAOBLOG_COMMENT_NOTIFICATION_ENABLED:false}
      recipient: ${HAOBLOG_COMMENT_NOTIFICATION_RECIPIENT:}
      from: ${HAOBLOG_COMMENT_NOTIFICATION_FROM:}
