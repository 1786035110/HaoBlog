services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - haoblog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HAOBLOG_SEED_ENABLED: "true"
      HAOBLOG_ADMIN_USERNAME: ${HAOBLOG_ADMIN_USERNAME:?HAOBLOG_ADMIN_USERNAME is required}
      HAOBLOG_ADMIN_PASSWORD_HASH: ${HAOBLOG_ADMIN_PASSWORD_HASH:?HAOBLOG_ADMIN_PASSWORD_HASH is required}
      HAOBLOG_COMMENT_SECURITY_KEY: ${HAOBLOG_COMMENT_SECURITY_KEY:?HAOBLOG_COMMENT_SECURITY_KEY is required}
      HAOBLOG_PUBLIC_BASE_URL: ${HAOBLOG_PUBLIC_BASE_URL:-http://localhost:3000}
      HAOBLOG_AUTHOR_NAME: ${HAOBLOG_AUTHOR_NAME:-Hao}
      HAOBLOG_MUSIC_MANIFEST_URL: ${HAOBLOG_MUSIC_MANIFEST_URL:-}
      HAOBLOG_COMMENT_NOTIFICATION_ENABLED: ${HAOBLOG_COMMENT_NOTIFICATION_ENABLED:-false}
      HAOBLOG_COMMENT_NOTIFICATION_SMTP_HOST: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_HOST:-}
      HAOBLOG_COMMENT_NOTIFICATION_SMTP_PORT: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_PORT:-25}
      HAOBLOG_COMMENT_NOTIFICATION_SMTP_USERNAME: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_USERNAME:-}
      HAOBLOG_COMMENT_NOTIFICATION_SMTP_PASSWORD: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_PASSWORD:-}
      HAOBLOG_COMMENT_NOTIFICATION_SMTP_TLS: ${HAOBLOG_COMMENT_NOTIFICATION_SMTP_TLS:-false}
      HAOBLOG_COMMENT_NOTIFICATION_RECIPIENT: ${HAOBLOG_COMMENT_NOTIFICATION_RECIPIENT:-}
      HAOBLOG_COMMENT_NOTIFICATION_FROM: ${HAOBLOG_COMMENT_NOTIFICATION_FROM:-}
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      HAOBLOG_OSS_ENABLED: ${HAOBLOG_OSS_ENABLED:-false}
      HAOBLOG_OSS_BUCKET: ${HAOBLOG_OSS_BUCKET:-}
      HAOBLOG_OSS_REGION: ${HAOBLOG_OSS_REGION:-}
      HAOBLOG_OSS_ENDPOINT: ${HAOBLOG_OSS_ENDPOINT:-}
      HAOBLOG_OSS_ACCESS_KEY_ID: ${HAOBLOG_OSS_ACCESS_KEY_ID:-}
      HAOBLOG_OSS_ACCESS_KEY_SECRET: ${HAOBLOG_OSS_ACCESS_KEY_SECRET:-}
      HAOBLOG_OSS_PUBLIC_BASE_URL: ${HAOBLOG_OSS_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_BASE_URL: http://api:8080
      HAOBLOG_MUSIC_MANIFEST_URL: ${HAOBLOG_MUSIC_MANIFEST_URL:-}
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/manifest.webmanifest',r=>process.exit(r.statusCode===200&&String(r.headers['content-type']).startsWith('application/manifest+json')?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  haoblog-postgres-data:
