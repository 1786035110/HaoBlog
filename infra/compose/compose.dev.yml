services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - haoblog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HAOBLOG_SEED_ENABLED: "true"
      HAOBLOG_ADMIN_USERNAME: ${HAOBLOG_ADMIN_USERNAME:?HAOBLOG_ADMIN_USERNAME is required}
      HAOBLOG_ADMIN_PASSWORD_HASH: ${HAOBLOG_ADMIN_PASSWORD_HASH:?HAOBLOG_ADMIN_PASSWORD_HASH is required}
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      HAOBLOG_COS_ENABLED: ${HAOBLOG_COS_ENABLED:-false}
      HAOBLOG_COS_BUCKET: ${HAOBLOG_COS_BUCKET:-}
      HAOBLOG_COS_REGION: ${HAOBLOG_COS_REGION:-}
      HAOBLOG_COS_SECRET_ID: ${HAOBLOG_COS_SECRET_ID:-}
      HAOBLOG_COS_SECRET_KEY: ${HAOBLOG_COS_SECRET_KEY:-}
      HAOBLOG_COS_PUBLIC_BASE_URL: ${HAOBLOG_COS_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_BASE_URL: http://api:8080
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  haoblog-postgres-data:
